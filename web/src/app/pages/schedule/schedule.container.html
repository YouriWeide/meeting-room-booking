<div class="container-fluid py-4">
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <h1 class="h4 mb-0 me-auto">{{ weekLabel() }}</h1>

    <div class="btn-group" role="group" aria-label="Week kiezen">
      <button type="button" class="btn btn-outline-secondary" (click)="showWeek(-1)">
        Vorige
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="showThisWeek()">
        Deze week
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="showWeek(1)">
        Volgende
      </button>
    </div>

    <button type="button" class="btn btn-primary" (click)="openBooking()">
      Nieuwe reservering
    </button>
  </div>

  @if (loadError(); as message) {
    <div class="alert alert-danger" role="alert">{{ message }}</div>
  }

  @if (loading()) {
    <div class="text-body-secondary">Bezig met laden…</div>
  } @else {
    <app-week-grid
      [rooms]="rooms()"
      [occurrences]="occurrences()"
      [weekStart]="weekStart()"
      [currentUserName]="userName() ?? ''"
      (slotSelected)="openBooking($event)"
      (cancelRequested)="cancelBooking($event)"
    />
  }
</div>
